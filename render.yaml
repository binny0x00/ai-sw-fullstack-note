services:
  - type: web
    name: ai-sw-basic-server
    runtime: node
    rootDir: server/basic-server
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm run build
    startCommand: pnpm run start:prod
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: TYPEORM_SYNCHRONIZE
        value: "false"
      - key: TYPEORM_MIGRATIONS_RUN
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN_SECONDS
        value: "1800"
      - key: CLIENT_ORIGIN
        value: https://replace-with-your-vercel-preview-url.vercel.app
      - key: AI_SERVER_BASE_URL
        value: http://localhost:8000
      - key: DATABASE_URL
        fromDatabase:
          name: ai-sw-basic-db
          property: connectionString

databases:
  - name: ai-sw-basic-db
    plan: free
