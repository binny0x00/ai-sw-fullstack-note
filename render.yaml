services:
  - type: web
    name: ai-sw-basic-server
    runtime: node
    rootDir: server/basic-server
    plan: free
    buildCommand: pnpm install --frozen-lockfile --prod=false && pnpm run build
    startCommand: pnpm run start:prod
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: TYPEORM_SYNCHRONIZE
        value: "false"
      - key: TYPEORM_MIGRATIONS_RUN
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN_SECONDS
        value: "1800"
      - key: CLIENT_ORIGIN
        value: https://replace-with-your-vercel-preview-url.vercel.app
      - key: AI_SERVER_BASE_URL
        value: https://ai-sw-ai-server.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: ai-sw-basic-db
          property: connectionString

  - type: web
    name: ai-sw-ai-server
    runtime: python
    rootDir: ai-server/ai-inquiry-rag-server
    plan: free
    buildCommand: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_NAME
        value: AI Inquiry RAG Server
      - key: DATABASE_URL
        fromDatabase:
          name: ai-sw-basic-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: OPENAI_CHAT_MODEL
        value: gpt-4.1-mini
      - key: RAG_COLLECTION_NAME
        value: ai_inquiry_documents
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPOSITORY
        value: binny0x00/ai-sw-fullstack-note
      - key: GITHUB_PROJECT_OWNER
        value: binny0x00
      - key: GITHUB_PROJECT_TITLE
        value: ai-inquiry
      - key: GITHUB_PROJECT_STATUS_FIELD
        value: Status
      - key: GITHUB_PROJECT_STATUS_OPTION
        value: Todo

databases:
  - name: ai-sw-basic-db
    plan: free
