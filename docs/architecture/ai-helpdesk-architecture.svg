<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1500" viewBox="0 0 1280 1500" role="img" aria-labelledby="title desc">
  <title id="title">AI Helpdesk Architecture Diagram</title>
  <desc id="desc">React, NestJS, FastAPI, PostgreSQL, pgvector, LangChain RAG, LangGraph Agent, OpenAI API, MCP GitHub tools로 구성된 AI Helpdesk 게시판 아키텍처 다이어그램</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#111827"/>
    </marker>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#0284c7"/>
    </marker>
    <marker id="arrow-purple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#059669"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .title { font: 700 34px 'Apple SD Gothic Neo', 'Noto Sans KR', Arial, sans-serif; fill: #d63b32; }
      .subtitle { font: 500 16px 'Apple SD Gothic Neo', 'Noto Sans KR', Arial, sans-serif; fill: #4b5563; }
      .node-title { font: 700 18px 'Apple SD Gothic Neo', 'Noto Sans KR', Arial, sans-serif; fill: #111827; }
      .node-text { font: 500 14px 'Apple SD Gothic Neo', 'Noto Sans KR', Arial, sans-serif; fill: #374151; }
      .small-text { font: 500 12px 'Apple SD Gothic Neo', 'Noto Sans KR', Arial, sans-serif; fill: #4b5563; }
      .step { font: 700 23px Arial, sans-serif; fill: #111827; }
      .label { font: 700 12px Arial, sans-serif; fill: #ffffff; }
      .actor { fill: #fff7e6; stroke: #f59e0b; stroke-width: 2; }
      .app { fill: #e0f2fe; stroke: #0284c7; stroke-width: 2; }
      .ai { fill: #ede9fe; stroke: #7c3aed; stroke-width: 2; }
      .data { fill: #ecfdf5; stroke: #059669; stroke-width: 2; }
      .external { fill: #fef2f2; stroke: #dc2626; stroke-width: 2; }
      .panel { fill: none; stroke: #9ca3af; stroke-width: 2; stroke-dasharray: 8 7; }
      .line { fill: none; stroke: #111827; stroke-width: 2.4; marker-end: url(#arrow); }
      .line-blue { fill: none; stroke: #0284c7; stroke-width: 2.4; marker-end: url(#arrow-blue); }
      .line-purple { fill: none; stroke: #7c3aed; stroke-width: 2.4; marker-end: url(#arrow-purple); }
      .line-green { fill: none; stroke: #059669; stroke-width: 2.4; marker-end: url(#arrow-green); }
      .line-dash { fill: none; stroke: #111827; stroke-width: 2.2; stroke-dasharray: 8 6; marker-end: url(#arrow); }
      .icon-stroke { fill: none; stroke: #111827; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect class="bg" width="1280" height="1500"/>
  <text x="640" y="54" text-anchor="middle" class="title">AI Helpdesk 게시판 - Architecture Diagram</text>
  <text x="640" y="84" text-anchor="middle" class="subtitle">React 게시판에서 NestJS API, FastAPI AI 서버, RAG, MCP GitHub 연동까지 이어지는 문의 처리 흐름</text>

  <rect x="62" y="120" width="1156" height="1240" rx="18" class="panel"/>
  <text x="82" y="150" class="small-text">Main Runtime Flow</text>

  <rect x="68" y="700" width="314" height="380" rx="14" class="panel"/>
  <text x="88" y="730" class="small-text">Knowledge &amp; Vector Store</text>

  <rect x="808" y="600" width="352" height="390" rx="14" class="panel"/>
  <text x="828" y="630" class="small-text">External AI / Tool Layer</text>

  <rect x="808" y="1016" width="352" height="190" rx="14" class="panel"/>
  <text x="828" y="1046" class="small-text">External Work Tracking</text>

  <g id="user-node">
    <rect x="98" y="185" width="220" height="112" rx="10" class="actor"/>
    <circle cx="136" cy="225" r="18" fill="#f59e0b"/>
    <path d="M118 264 C122 244 150 244 154 264" class="icon-stroke"/>
    <text x="184" y="218" class="node-title">일반 사용자</text>
    <text x="184" y="244" class="node-text">문의 작성</text>
    <text x="184" y="266" class="node-text">댓글 확인</text>
  </g>

  <g id="client-node">
    <rect x="448" y="165" width="300" height="140" rx="10" class="app"/>
    <circle cx="488" cy="216" r="28" fill="#0284c7"/>
    <text x="488" y="224" text-anchor="middle" class="label">UI</text>
    <text x="548" y="206" class="node-title">React + Vite</text>
    <text x="548" y="232" class="node-text">client/basic-client</text>
    <text x="548" y="254" class="node-text">게시판 / 관리자 AI 화면</text>
    <text x="548" y="276" class="node-text">JWT 요청</text>
  </g>

  <g id="nest-node">
    <rect x="448" y="392" width="300" height="154" rx="10" class="app"/>
    <circle cx="488" cy="447" r="28" fill="#0284c7"/>
    <text x="488" y="455" text-anchor="middle" class="label">API</text>
    <text x="548" y="426" class="node-title">NestJS + TypeORM</text>
    <text x="548" y="452" class="node-text">server/basic-server</text>
    <text x="548" y="474" class="node-text">인증 / 게시글 / 댓글 / 태그</text>
    <text x="548" y="496" class="node-text">AI 서버 프록시</text>
  </g>

  <g id="db-node">
    <rect x="874" y="332" width="276" height="210" rx="10" class="data"/>
    <path d="M920 380 C920 363 1005 363 1005 380 L1005 484 C1005 501 920 501 920 484 Z" fill="#10b981" opacity="0.92"/>
    <path d="M920 380 C920 397 1005 397 1005 380" fill="none" stroke="#ffffff" stroke-width="4"/>
    <path d="M920 432 C920 449 1005 449 1005 432" fill="none" stroke="#ffffff" stroke-width="3"/>
    <text x="1038" y="384" class="node-title">PostgreSQL</text>
    <text x="1038" y="410" class="node-text">users / posts / comments</text>
    <text x="1038" y="432" class="node-text">inquiries / analysis</text>
    <text x="1038" y="454" class="node-text">agent / mcp / api logs</text>
    <text x="1038" y="476" class="node-text">공유 데이터 저장소</text>
  </g>

  <g id="fastapi-node">
    <rect x="448" y="640" width="300" height="154" rx="10" class="app"/>
    <circle cx="488" cy="696" r="28" fill="#0284c7"/>
    <text x="488" y="704" text-anchor="middle" class="label">AI</text>
    <text x="548" y="674" class="node-title">FastAPI AI Server</text>
    <text x="548" y="700" class="node-text">ai-inquiry-rag-server</text>
    <text x="548" y="722" class="node-text">RAG / Agent / MCP</text>
    <text x="548" y="744" class="node-text">Observability</text>
  </g>

  <g id="docs-node">
    <rect x="104" y="762" width="240" height="112" rx="10" class="data"/>
    <rect x="126" y="790" width="42" height="54" rx="4" fill="#059669"/>
    <line x1="136" y1="806" x2="158" y2="806" stroke="#ffffff" stroke-width="4"/>
    <line x1="136" y1="822" x2="158" y2="822" stroke="#ffffff" stroke-width="4"/>
    <text x="190" y="804" class="node-title">Markdown Docs</text>
    <text x="190" y="830" class="node-text">FAQ / 장애 대응</text>
    <text x="190" y="852" class="node-text">운영 문서</text>
  </g>

  <g id="rag-node">
    <rect x="104" y="914" width="240" height="112" rx="10" class="ai"/>
    <circle cx="146" cy="970" r="28" fill="#7c3aed"/>
    <text x="146" y="978" text-anchor="middle" class="label">RAG</text>
    <text x="190" y="956" class="node-title">LangChain RAG</text>
    <text x="190" y="982" class="node-text">chunk / embedding</text>
    <text x="190" y="1004" class="node-text">similarity search</text>
  </g>

  <g id="pgvector-node">
    <rect x="104" y="1082" width="240" height="126" rx="10" class="data"/>
    <circle cx="146" cy="1144" r="28" fill="#059669"/>
    <text x="146" y="1152" text-anchor="middle" class="label">VEC</text>
    <text x="190" y="1124" class="node-title">pgvector</text>
    <text x="190" y="1150" class="node-text">langchain_pg_collection</text>
    <text x="190" y="1172" class="node-text">langchain_pg_embedding</text>
  </g>

  <g id="agent-node">
    <rect x="448" y="906" width="300" height="158" rx="10" class="ai"/>
    <circle cx="488" cy="964" r="28" fill="#7c3aed"/>
    <text x="488" y="972" text-anchor="middle" class="label">AGT</text>
    <text x="548" y="944" class="node-title">LangGraph Agent</text>
    <text x="548" y="970" class="node-text">문의 유형 / 긴급도 판단</text>
    <text x="548" y="992" class="node-text">답변 초안 생성</text>
    <text x="548" y="1014" class="node-text">GitHub Issue 필요 여부 판단</text>
  </g>

  <g id="openai-node">
    <rect x="874" y="676" width="276" height="120" rx="10" class="ai"/>
    <circle cx="918" cy="736" r="28" fill="#7c3aed"/>
    <text x="918" y="744" text-anchor="middle" class="label">LLM</text>
    <text x="974" y="724" class="node-title">OpenAI API</text>
    <text x="974" y="750" class="node-text">text-embedding-3-small</text>
    <text x="974" y="772" class="node-text">Chat completion</text>
  </g>

  <g id="mcp-node">
    <rect x="874" y="850" width="276" height="126" rx="10" class="ai"/>
    <circle cx="918" cy="912" r="28" fill="#7c3aed"/>
    <text x="918" y="920" text-anchor="middle" class="label">MCP</text>
    <text x="974" y="894" class="node-title">MCP GitHub Tools</text>
    <text x="974" y="920" class="node-text">search_github_issues</text>
    <text x="974" y="942" class="node-text">create_github_issue</text>
  </g>

  <g id="github-node">
    <rect x="874" y="1074" width="276" height="126" rx="10" class="external"/>
    <circle cx="918" cy="1136" r="28" fill="#dc2626"/>
    <text x="918" y="1144" text-anchor="middle" class="label">GH</text>
    <text x="974" y="1118" class="node-title">GitHub</text>
    <text x="974" y="1144" class="node-text">Issues / Projects</text>
    <text x="974" y="1166" class="node-text">개발 이슈 관리</text>
  </g>

  <g id="manager-node">
    <rect x="98" y="1250" width="220" height="112" rx="10" class="actor"/>
    <circle cx="136" cy="1290" r="18" fill="#f59e0b"/>
    <path d="M118 1329 C122 1309 150 1309 154 1329" class="icon-stroke"/>
    <text x="184" y="1282" class="node-title">관리자</text>
    <text x="184" y="1308" class="node-text">AI 검토 확인</text>
    <text x="184" y="1330" class="node-text">댓글 / Issue 승인</text>
  </g>

  <g id="dashboard-node">
    <rect x="448" y="1224" width="300" height="138" rx="10" class="app"/>
    <circle cx="488" cy="1278" r="28" fill="#0284c7"/>
    <text x="488" y="1286" text-anchor="middle" class="label">OBS</text>
    <text x="548" y="1262" class="node-title">Admin AI Dashboard</text>
    <text x="548" y="1288" class="node-text">RAG 상태 / Agent 단계 로그</text>
    <text x="548" y="1310" class="node-text">API·MCP·LLM 요약 지표</text>
  </g>

  <g id="developer-node">
    <rect x="898" y="1250" width="220" height="112" rx="10" class="actor"/>
    <circle cx="936" cy="1290" r="18" fill="#f59e0b"/>
    <path d="M918 1329 C922 1309 950 1309 954 1329" class="icon-stroke"/>
    <text x="984" y="1282" class="node-title">개발자</text>
    <text x="984" y="1308" class="node-text">Issue 기반</text>
    <text x="984" y="1330" class="node-text">후속 작업</text>
  </g>

  <path d="M318 241 L438 235" class="line"/>
  <text x="364" y="224" class="step">1</text>

  <path d="M598 305 L598 382" class="line"/>
  <text x="614" y="356" class="step">2</text>

  <path d="M748 452 L864 434" class="line-green"/>
  <text x="798" y="421" class="step">3</text>

  <path d="M598 546 L598 630" class="line-blue"/>
  <text x="616" y="604" class="step">4</text>

  <path d="M748 704 C810 690 823 544 864 496" class="line-green"/>
  <text x="812" y="632" class="step">5</text>

  <path d="M344 818 L426 818 C426 758 432 732 438 724" class="line-green"/>
  <text x="384" y="802" class="step">6</text>

  <path d="M224 874 L224 904" class="line-purple"/>
  <path d="M224 1026 L224 1072" class="line-green"/>
  <path d="M344 971 L438 966" class="line-purple"/>
  <text x="356" y="948" class="step">7</text>

  <path d="M598 794 L598 896" class="line-purple"/>
  <text x="616" y="860" class="step">8</text>

  <path d="M748 960 C812 920 805 752 864 740" class="line-purple"/>
  <text x="802" y="838" class="step">9</text>

  <path d="M748 985 L864 912" class="line-purple"/>
  <text x="808" y="940" class="step">10</text>

  <path d="M1012 976 L1012 1064" class="line"/>
  <text x="1030" y="1030" class="step">11</text>

  <path d="M874 1128 C786 1128 776 1046 748 1022" class="line-dash"/>
  <text x="798" y="1092" class="step">12</text>

  <path d="M448 1030 C396 1012 390 520 438 498" class="line-dash"/>
  <text x="408" y="772" class="step">13</text>

  <path d="M318 1306 L438 1292" class="line"/>
  <text x="362" y="1285" class="step">14</text>

  <path d="M748 1292 C812 1270 814 1188 864 1150" class="line"/>
  <text x="802" y="1220" class="step">15</text>

  <path d="M748 717 C792 762 792 1270 758 1288" class="line-blue"/>
  <text x="770" y="1012" class="step">16</text>

  <path d="M1118 1200 L1008 1240" class="line"/>

  <g id="legend">
    <rect x="282" y="1390" width="716" height="58" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="2" stroke-dasharray="7 6"/>
    <rect x="310" y="1410" width="18" height="18" class="app"/>
    <text x="338" y="1424" class="small-text">Application</text>
    <rect x="454" y="1410" width="18" height="18" class="ai"/>
    <text x="482" y="1424" class="small-text">AI / Agent / Tool</text>
